plugins {
    id 'com.android.application' version '8.12.0'
}

android {
    namespace 'com.instanttranslate.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.instanttranslate.app'
        minSdk 26
        targetSdk 34
        versionCode project.property('APP_VERSION_CODE').toInteger()
        versionName project.property('APP_VERSION_NAME')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'app_name', "Instant Translate v${project.property('APP_VERSION_NAME')}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep local test installs updatable; fresh clones use Android's standard debug key.
    def localDebugKey = file('../work/android-build/debug.keystore')
    if (localDebugKey.exists()) {
        signingConfigs {
            projectDebug {
                storeFile localDebugKey
                storePassword 'android'
                keyAlias 'debug'
                keyPassword 'android'
                enableV4Signing false
            }
        }
        buildTypes.debug.signingConfig = signingConfigs.projectDebug
    }

}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
